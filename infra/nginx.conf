events {}

http {
  # Short-lived shared cache for the supply catalog, standing in for a CDN edge.
  proxy_cache_path /tmp/nginx-cache levels=1:2 keys_zone=catalog:10m max_size=100m inactive=10m;

  upstream recura_api {
    least_conn;                     # send each request to the least busy instance
    server api1:3000 max_fails=3 fail_timeout=10s;
    server api2:3000 max_fails=3 fail_timeout=10s;
    server api3:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  server {
    listen 80;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_next_upstream error timeout http_502 http_503 http_504;

    # Supply catalog: honor the API's s-maxage / stale-if-error so it stays readable
    # even if every API instance is briefly unreachable.
    location = /api/supplies {
      proxy_pass http://recura_api;
      proxy_cache catalog;
      proxy_cache_key "$request_uri|$http_authorization";
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;
      add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
      proxy_pass http://recura_api;
    }
  }
}
