# Full stack: 3 API instances behind an nginx load balancer, plus every datastore.
#   docker compose up --build
# Portal: http://localhost:8080
services:
  lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api1, api2, api3]

  api1: &api
    build: .
    environment: &apienv
      INSTANCE_ID: api1
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      APPOINTMENTS_STORE: external
      SUPPLIES_STORE: external
      AUTOMATIONS_STORE: external
      FOOD_STORE: external
      DATABASE_URL: postgres://recura:recura@postgres:5432/recura
      CASSANDRA_CONTACT_POINTS: cassandra
      DYNAMO_ENDPOINT: http://dynamodb:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      cassandra: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      dynamodb: { condition: service_started }
    restart: on-failure
  api2:
    <<: *api
    environment:
      <<: *apienv
      INSTANCE_ID: api2
  api3:
    <<: *api
    environment:
      <<: *apienv
      INSTANCE_ID: api3

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: recura
      POSTGRES_PASSWORD: recura
      POSTGRES_DB: recura
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recura"]
      interval: 5s
      retries: 20

  cassandra:
    image: cassandra:5
    ports: ["9042:9042"]
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes: [cassandradata:/var/lib/cassandra]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 10s
      retries: 30

  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports: ["8000:8000"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: [esdata:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 30

volumes:
  pgdata:
  cassandradata:
  esdata:
